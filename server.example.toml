server = { listen = "127.0.0.1:7878" }
# newt runs its own Postgres in .newt/postgres. For a Postgres you run, use
# database = { url_env = "NEWT_DATABASE_URL", max_connections = 10 }
database = { embedded = ".newt/postgres", max_connections = 10 }
events = { jsonl = "newt-events.jsonl" }
# cache_key_buckets: how many prompt cache keys the sessions of one agent
# share. "auto" (the default) measures each agent's calls a minute and uses
# just enough keys to keep each under OpenAI's spill point; a number fixes it.
# give_up_after: failed attempts before a turn with no effects is given up.
runner = { max_sessions = 64, cache_key_buckets = "auto", give_up_after = 5 }
# Days to keep consumed events and live feed frames (0 keeps them forever).
# History stays until you delete the session.
retention = { inbox_days = 30, live_days = 7 }

[routes.openai]
protocol = "openai-responses"
model = "gpt-6.1-terra"
base_url = "https://api.openai.com/v1"
key_env = "OPENAI_API_KEY"
max_concurrent = 6

[routes.anthropic]
protocol = "anthropic-messages"
model = "claude-opus-5-5"
base_url = "https://api.anthropic.com"
key_env = "ANTHROPIC_API_KEY"
max_concurrent = 6

[models.default]
chain = ["openai", "anthropic"]

# An agent is its agent core, an MCP server: its instructions, model, tools,
# skills and pages all come from it. Reach it over HTTP, or let newt run it:
# mcp = "stdio:node ./agent/server.js"
[agents.assistant]
mcp = "http://localhost:4000/mcp"
token_env = "ASSISTANT_TOKEN"

# Export one trace per turn over OTLP/HTTP (JSON). For Langfuse, headers_env names a variable
# holding "Authorization=Basic <base64 public:secret>,x-langfuse-ingestion-version=4".
# [tracing]
# endpoint = "https://cloud.langfuse.com/api/public/otel/v1/traces"
# profile = "langfuse"
# headers_env = "NEWT_OTLP_HEADERS"
# capture_content = true
