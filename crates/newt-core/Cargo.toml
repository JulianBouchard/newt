[package]
name = "newt-core"
version = "0.1.0"
description = "Agent loop, context model and provider clients for newt"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde", "formatting", "parsing"] }
tokio = { version = "1.54.1", features = ["rt", "sync", "fs", "io-util", "macros"] }
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
