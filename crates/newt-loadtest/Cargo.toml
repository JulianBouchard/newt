[package]
name = "newt-loadtest"
version = "2.2.1"
description = "Load testing for newt: a fake model server, a mock app with mocked tools from a load profile, and a load driver"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
futures-util = "0.3.34"
newt-core = { version = "2.2.1", path = "../newt-core" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "json", "stream"] }
rmcp = { version = "3.9.0", default-features = false, features = ["server", "transport-streamable-http-server", "transport-io"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-std"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[dev-dependencies]
newt-server = { version = "2.2.1", path = "../newt-server" }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros"] }
tokio-util = "0.7.20"
