[package]
name = "newt-otlp"
version = "2.3.0"
description = "OpenTelemetry trace export for newt turns"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
newt-core = { version = "2.3.0", path = "../newt-core" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
time = "0.3.55"
tokio = { version = "1.54.1", features = ["rt", "sync", "time", "macros"] }
tracing = "0.1.44"

[dev-dependencies]
axum = "0.8.9"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time"] }
tokio-util = "0.7.20"
