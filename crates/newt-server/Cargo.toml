[package]
name = "newt-server"
version = "1.6.0"
description = "The newt agent runtime server"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "newt"
path = "src/main.rs"

[features]
default = ["embedded-postgres"]
embedded-postgres = ["dep:postgresql_embedded", "dep:postgresql_archive"]

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
futures-util = "0.3.34"
newt-core = { version = "1.6.0", path = "../newt-core" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "json"] }
rmcp = { version = "3.9.0", default-features = false, features = ["client", "reqwest", "transport-streamable-http-client-reqwest"] }
postgresql_archive = { version = "0.22.0", default-features = false, features = ["zonky"], optional = true }
postgresql_embedded = { version = "0.22.0", default-features = false, features = ["zonky", "tokio", "tls-rustls-aws-lc-rs"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_norway = "0.9.42"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "macros", "json"] }
subtle = "2.6.1"
thiserror = "2.0.21"
time = "0.3.55"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "net", "sync", "time"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1.29.2", features = ["v7"] }

[dev-dependencies]
rmcp = { version = "3.9.0", default-features = false, features = ["client", "reqwest", "transport-streamable-http-client-reqwest", "server", "transport-streamable-http-server"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream"] }
tempfile = "3.27.0"
