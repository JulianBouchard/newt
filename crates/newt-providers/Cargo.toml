[package]
name = "newt-providers"
version = "2.4.0"
description = "Model provider clients for newt: Anthropic Messages, OpenAI Responses and Chat Completions"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
futures-util = "0.3.34"
newt-core = { version = "2.4.0", path = "../newt-core" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "sync", "fs", "io-util", "macros", "time"] }
tokio-util = "0.7.20"

[dev-dependencies]
axum = "0.8.9"
proptest = "1.12.0"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time"] }
