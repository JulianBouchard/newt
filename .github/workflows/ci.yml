name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: "0"
  DATABASE_URL: postgres://newt:newt@localhost:5432/newt

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: newt
          POSTGRES_PASSWORD: newt
          POSTGRES_DB: newt
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U newt"
          --health-interval 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.99.1"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-deny,cargo-machete
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo clippy -p newt-server --no-default-features --all-targets -- -D warnings
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo deny check
      - run: cargo machete
      - name: boot smoke test
        env:
          NEWT_CONFIG: server.example.toml
          OPENAI_API_KEY: unused
          ANTHROPIC_API_KEY: unused
          ASSISTANT_TOKEN: unused
        run: |
          cargo build -p newt-server
          ./target/debug/newt &
          pid=$!
          for _ in $(seq 1 300); do
            curl -sf localhost:7878/healthz && break
            sleep 0.2
          done
          curl -sf localhost:7878/healthz
          kill -TERM "$pid"
          wait "$pid"
